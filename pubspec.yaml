name: one_click_shorts
description: One Click Shorts - 9:16 Shorts creator with on-device TTS and FFmpeg rendering.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  video_player: ^2.9.2
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  flutter_tts: ^4.2.5
  ffmpeg_kit_flutter_new: ^4.6.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
